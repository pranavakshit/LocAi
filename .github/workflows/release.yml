name: Release Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pystray Pillow

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React UI
        working-directory: ./ui
        run: |
          npm install
          npm run build

      - name: Build PyInstaller Directory Bundle (for Installer)
        run: |
          pyinstaller --name "LocAi" --onedir --windowed --add-data "ui/dist;ui/dist" launcher.py

      - name: Build PyInstaller Portable Executable
        run: |
          pyinstaller --name "LocAi-portable" --onefile --windowed --add-data "ui/dist;ui/dist" launcher.py

      - name: Build Inno Setup Installer
        run: |
          iscc LocAi.iss

      - name: Get Release Notes
        id: release_notes
        run: |
          if (Test-Path "RELEASE_NOTES_LATEST.md") {
            $notes = Get-Content "RELEASE_NOTES_LATEST.md" -Raw
            echo "notes<<EOF" >> $env:GITHUB_OUTPUT
            echo "$notes" >> $env:GITHUB_OUTPUT
            echo "EOF" >> $env:GITHUB_OUTPUT
          } else {
            echo "notes=Release of LocAi" >> $env:GITHUB_OUTPUT
          }
          
      - name: Determine Tag
        id: get_tag
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            echo "TAG_NAME=${{ github.ref_name }}" >> $env:GITHUB_ENV
          } else {
            $tags = git tag --sort=-creatordate
            $unused_tag = $null
            foreach ($tag in $tags) {
              if ($tag -match '^v') {
                $response = curl.exe -s -o NUL -w "%{http_code}" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag
                if ($response -eq '404') {
                  $unused_tag = $tag
                  break
                }
              }
            }
            if (-not $unused_tag) {
              Write-Error "No unused 'v*' tags found without a release!"
              exit 1
            }
            echo "TAG_NAME=$unused_tag" >> $env:GITHUB_ENV
          }

      - name: Rename Executables
        run: |
          Move-Item -Path "Output\LocAi-installer.exe" -Destination "Output\LocAi-${{ env.TAG_NAME }}-installer.exe"
          Move-Item -Path "dist\LocAi-portable.exe" -Destination "dist\LocAi-${{ env.TAG_NAME }}-portable.exe"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/LocAi-*-installer.exe
            dist/LocAi-*-portable.exe
          body: ${{ steps.release_notes.outputs.notes }}
          name: Release ${{ env.TAG_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Release Notes
        run: |
          if (Test-Path "RELEASE_NOTES_LATEST.md") {
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git rm RELEASE_NOTES_LATEST.md
            git commit -m "chore: clean up release notes after publish"
            git push origin HEAD:main
          }
